[package]
name = "rosu-pp-py"
version = "4.0.2"
edition = "2021"
authors = ["Max Ohn <ohn.m@hotmail.de>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/MaxOhn/rosu-pp-py"
description = "Difficulty and performance calculation for osu!"

[lib]
name = "rosu_pp_py"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29.2", features = ["extension-module", "macros"] }
rosu-mods = { git = "https://github.com/unclem2/rosu-mods", default-features = false, features = ["serde"] }
rosu-pp = { git = "https://github.com/unclem2/rosu-pp", features = ["sync"] }
# rosu-pp = { git = "https://github.com/MaxOhn/rosu-pp", branch = "pp-update", features = ["sync"] }
serde = { version = "1.0.229" }

[profile.release]
lto = true
panic = "abort"
codegen-units = 1
strip = true
